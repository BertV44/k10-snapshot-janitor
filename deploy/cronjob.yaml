# =============================================================================
# COMMUNITY TOOL - NOT SUPPORTED BY VEEAM
#   Independent project, with no affiliation with Veeam Software. Provided
#   without any warranty; no vendor support channel covers it.
#   This CronJob DELETES BACKUPS. It ships in dry-run: only set PURGE_APPLY to
#   "true" after validating in a lab against your own versions.
# =============================================================================
# Daily housekeeping of K10 snapshots past an age threshold
# In-cluster deployment (OpenShift 4.x / Kubernetes 1.27+)
#
# Target: Veeam Kasten 8.5.x / 9.0.x, installed in the "kasten-io" namespace
#
# PREREQUISITE: create the ConfigMap holding the script BEFORE applying this
#   oc -n kasten-io create configmap k10-snapshot-janitor-script \
#      --from-file=k10-snapshot-janitor.sh=./k10-snapshot-janitor.sh
#
# APPLY
#   oc apply -f deploy/cronjob.yaml
#
# The CronJob ships in DRY-RUN. To enable deletions, set PURGE_APPLY to "true"
# in the k10-snapshot-janitor-config ConfigMap.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k10-snapshot-janitor
  namespace: kasten-io
  labels:
    app.kubernetes.io/name: k10-snapshot-janitor
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/managed-by: tam-emea
---
# Cluster-scoped permissions: read and delete RestorePointContents, read
# RestorePoints and RetireActions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k10-snapshot-janitor
  labels:
    app.kubernetes.io/name: k10-snapshot-janitor
rules:
  - apiGroups: ["apps.kio.kasten.io"]
    resources: ["restorepointcontents"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps.kio.kasten.io"]
    resources: ["restorepoints"]
    verbs: ["get", "list"]
  - apiGroups: ["actions.kio.kasten.io"]
    resources: ["retireactions"]
    verbs: ["get", "list"]
  # Verification de presence du CRD au demarrage (facultatif : retirer si refuse)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
    resourceNames: ["restorepointcontents.apps.kio.kasten.io"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10-snapshot-janitor
  labels:
    app.kubernetes.io/name: k10-snapshot-janitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k10-snapshot-janitor
subjects:
  - kind: ServiceAccount
    name: k10-snapshot-janitor
    namespace: kasten-io
---
# Namespaced permissions: read the policies (to detect deleted ones) and the
# deployments (to report the K10 version in the log).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k10-snapshot-janitor
  namespace: kasten-io
rules:
  - apiGroups: ["config.kio.kasten.io"]
    resources: ["policies"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k10-snapshot-janitor
  namespace: kasten-io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k10-snapshot-janitor
subjects:
  - kind: ServiceAccount
    name: k10-snapshot-janitor
    namespace: kasten-io
---
# Runtime settings. Change them here, not in the CronJob.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k10-snapshot-janitor-config
  namespace: kasten-io
data:
  # Age threshold in days beyond which a snapshot becomes a candidate
  RETENTION_DAYS: "7"
  # "true" = real deletion. Any other value = dry-run.
  PURGE_APPLY: "false"
  # Number of most recent snapshots always kept, per application
  MIN_KEEP: "1"
  # Safety cap: abort if the number of candidates exceeds this
  MAX_DELETIONS: "50"
  # Restrict to strict orphans: "true" enables
  #   --require-unbound (application deleted) and
  #   --orphan-policy-only (policy missing or deleted)
  CONSERVATIVE_MODE: "false"
  # Application namespaces never to purge, space separated
  EXCLUDE_NAMESPACES: ""
  # Policies to exclude, space separated
  EXCLUDE_POLICIES: ""
  # Applications to exclude, space separated
  EXCLUDE_APPS: ""
  # Restrict the scope to these namespaces only, space separated.
  # Empty = the whole cluster.
  INCLUDE_NAMESPACES: ""
  # Seconds to wait for the RetireActions to complete (0 = no wait)
  WAIT_RETIRE: "0"
  K10_NAMESPACE: "kasten-io"
---
# Persistence for the audit reports. Drop this PVC and the matching volume in
# the CronJob to rely on the pod logs only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k10-snapshot-janitor-reports
  namespace: kasten-io
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <set this if there is no default class>
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k10-snapshot-janitor
  namespace: kasten-io
  labels:
    app.kubernetes.io/name: k10-snapshot-janitor
    app.kubernetes.io/component: maintenance
spec:
  # Every day at 03:00. The cluster timezone applies unless timeZone is set.
  schedule: "0 3 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k10-snapshot-janitor
        spec:
          serviceAccountName: k10-snapshot-janitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              # Image contenant oc (ou kubectl) et jq >= 1.6.
              # Build with the provided Containerfile, then push it to the
              # registre interne :
              #   image-registry.openshift-image-registry.svc:5000/kasten-io/k10-snapshot-janitor:1.0.0
              # Alternative publique rapide : docker.io/alpine/k8s:1.30.2
              image: REGISTRY/k10-snapshot-janitor:1.0.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                - configMapRef:
                    name: k10-snapshot-janitor-config
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -Eeuo pipefail
                  ARGS=( --retention-days "${RETENTION_DAYS}"
                         --k10-namespace "${K10_NAMESPACE}"
                         --min-keep "${MIN_KEEP}"
                         --max-deletions "${MAX_DELETIONS}"
                         --wait-retire "${WAIT_RETIRE}"
                         --report-dir /reports
                         --metrics-file /reports/k10-janitor.prom )

                  if [[ "${PURGE_APPLY}" == "true" ]]; then
                    ARGS+=( --apply )
                  fi

                  if [[ "${CONSERVATIVE_MODE}" == "true" ]]; then
                    ARGS+=( --require-unbound --orphan-policy-only )
                  fi

                  # set -f: word splitting is intended, globbing is not.
                  # Without it, EXCLUDE_NAMESPACES="prod-*" would be expanded
                  # against the container working directory.
                  # The ':-' keep a ConfigMap predating these keys from failing
                  # the Job under 'set -u'.
                  set -f
                  for ns  in ${EXCLUDE_NAMESPACES:-};  do ARGS+=( --exclude-namespace "$ns" );  done
                  for po  in ${EXCLUDE_POLICIES:-};    do ARGS+=( --exclude-policy    "$po" );  done
                  for ap  in ${EXCLUDE_APPS:-};        do ARGS+=( --exclude-app       "$ap" );  done
                  for ins in ${INCLUDE_NAMESPACES:-};  do ARGS+=( --include-namespace "$ins" ); done
                  set +f

                  echo "Command: k10-snapshot-janitor.sh ${ARGS[*]}"
                  exec /opt/janitor/k10-snapshot-janitor.sh "${ARGS[@]}"
              volumeMounts:
                - name: script
                  mountPath: /opt/janitor
                  readOnly: true
                - name: reports
                  mountPath: /reports
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: k10-snapshot-janitor-script
                defaultMode: 0555
            - name: reports
              persistentVolumeClaim:
                claimName: k10-snapshot-janitor-reports
            - name: tmp
              emptyDir: {}
